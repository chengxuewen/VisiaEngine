[package]
name = "visiaengine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VisiaEngine C ABI face (band 2): the sole stable boundary for host embedding (D2/D6)"

[features]
default = []
web = ["visiaengine-render-wgpu/web", "dep:web-sys"]   # engine canvas entry only; the js glue lives in visiaengine-wasm

[lib]
name = "visiaengine"            # [FFI-R:v13-FEAS-4] artifact name = libvisiaengine.so, the -lvisiaengine link precondition
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
raw-window-handle.workspace = true
wgpu.workspace = true
visiaengine-core.workspace = true
visiaengine-render.workspace = true
visiaengine-render-wgpu.workspace = true
visiaengine-io-gltf.workspace = true
visiaengine-io-points.workspace = true
visiaengine-io-hdr.workspace = true
visiaengine-io-tiles.workspace = true
visiaengine-io-text.workspace = true
visiaengine-geo.workspace = true
# since I2 also: visiaengine-{render-wgpu,geo,io-gltf} + wgpu + raw-window-handle (s3 boundary)

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

# Workspace lint policy (see the root Cargo.toml note on the 37-block debt).
[lints]
workspace = true
