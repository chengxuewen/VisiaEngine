[package]
name = "visiaengine-io-tiles"
description = "Tile streaming (architecture 7 io-* family): MVT (Mapbox Vector Tile) decode -> local geometry + slippy tile math. Zero network deps (Phase 0: file sources only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
visiaengine-core.workspace = true
thiserror.workspace = true
image = { workspace = true }
# native-only: wasm tile fetch is host-driven (js fetch), getrandom/js feature conflicts stay out
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
