[package]
name = "visiaengine-render-wgpu"
description = "默认渲染后端：基于 wgpu 的自研管线（D4 终审）。wgpu 类型止步于本 crate（不变式②）。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
web = ["dep:web-sys"]   # 批 7：Canvas attach（wasm32 代码路径自带 cfg）

[dependencies]
visiaengine-core.workspace = true
visiaengine-render.workspace = true
wgpu.workspace = true
winit.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
glam.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

[dev-dependencies]
image = { workspace = true }   # E901 PNG 落盘（人检图，T3 素材）
# 装配示例专用（dev 面不传染正常依赖图：example 是 io×render 合流的演示位）
visiaengine-io-gltf.workspace = true
visiaengine-geo.workspace = true
