[package]
name = "visiaengine-render-wgpu"
description = "default render backend: the in-house pipeline on wgpu (D4 final ruling). wgpu types stop at this crate (invariant 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
web = ["dep:web-sys"]   # band 7: Canvas attach (the wasm32 code path carries its own cfg)

[dependencies]
visiaengine-core.workspace = true
visiaengine-render.workspace = true
wgpu.workspace = true
winit.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
glam.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

[dev-dependencies]
image = { workspace = true }   # E901 PNG write-out (human-check images, T3 material)
# assembly-demo only (the dev side does not infect the normal dependency graph: examples are where io x render converges for demos)
visiaengine-io-gltf.workspace = true
visiaengine-geo.workspace = true
visiaengine-io-text.workspace = true
