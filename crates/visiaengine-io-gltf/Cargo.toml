[package]
name = "visiaengine-io-gltf"
description = "glTF loading (architecture 2, io-* family): parses .glb/.gltf into CPU-side core data. Zero render dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
visiaengine-core.workspace = true
image.workspace = true
thiserror.workspace = true
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
# measured (gltf-1.4.1 source): Gltf::from_slice(GLB) + accessor::util::Iter need only utils;
# the import/image/urlencoding chain stays out entirely (v0 = GLB-only; multi-file .gltf re-evaluates import in a later slice)

[dev-dependencies]
proptest.workspace = true
visiaengine-core.workspace = true
image.workspace = true
