# cargo-deny -- licenses + bans + sources + advisories, all enforced by `pixi run audit`.
# The advisory DB is fetched live (RUSTSEC-2026-0382 was fixed this way on 2026-10-29).
# Invariant ⑥ reference: any MPL-family item appearing in the tree triggers manual review (zero-pollution principle for the core static link).
# MPL-2.0 is deliberately NOT in the allow list: the tree currently has zero MPL crates, so an MPL
# dependency must fail the gate and be adjudicated rather than slip in silently.
# Schema basis: measured against the cargo-deny 0.20.2 init template (0.20 changes: the [licenses] default key removed, highlight is an enum).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",  # webpki-roots (Mozilla root CA data, permissive)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # intra-workspace path deps without a version are the norm; not a wildcard violation
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://index.crates.io"]

[advisories]
# Exception whitelist (reason + re-review trigger per entry; D-18 candidate = submitted with S2 N1, user ruling option A approved 2026-09-18)
ignore = [
    # RUSTSEC-2026-0192: ttf-parser "author declared unmaintained" -- category = unmaintained, not a vulnerability.
    # Attack-surface verdict: font bytes = host-injected own assets (same trust level as load_gltf), not third-party network input;
    # parse panics are caught by the capi_guard fence (the VE_ERR_PANIC family).
    # Stack-swap cost: ab_glyph depends on ttf-parser too (option C is void); swash/skrifa directly = +45KB gz, trips R2, 2x the schedule.
    # Re-review triggers: ① a fontdue version shipping a skrifa backend ② untrusted font input becomes a real use case (online package download path)
    #           ③ a real PoC crash sample appears. Any hit = swap io-text to swash (the interface is already isolated; non-breaking).
    "RUSTSEC-2026-0192",
]
