[workspace]
resolver = "3"
members = ["crates/*", "examples/rs", "bindings/wasm/visiaengine-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://gitee.com/chengxuewen/VisiaEngine"

# Workspace-wide lint policy (safety-oriented). `pixi run lint` already runs
# `-D warnings`, so `unsafe_op_in_unsafe_fn` turns "an unsafe fn needs an inner
# unsafe block" into a build failure instead of a review convention.
# `clippy::undocumented_unsafe_blocks` is deliberately NOT enabled: the FFI crate
# still has 37 legacy blocks without SAFETY comments, and the lint cannot be scoped
# per crate under `-D warnings` (the command line wins over [lints]). It stays
# tracked as debt; enable it workspace-wide once the backfill lands.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
proptest = "1"
# Internal crates (paths declared once here; members reference with .workspace = true)
visiaengine-core = { path = "crates/visiaengine-core", version = "0.1.0" }
visiaengine-render = { path = "crates/visiaengine-render", version = "0.1.0" }
visiaengine-render-wgpu = { path = "crates/visiaengine-render-wgpu", version = "0.1.0" }
visiaengine-io-text = { path = "crates/visiaengine-io-text", version = "0.1.0" }
visiaengine-io-gltf = { path = "crates/visiaengine-io-gltf", version = "0.1.0" }
visiaengine-io-points = { path = "crates/visiaengine-io-points", version = "0.1.0" }
visiaengine-io-tiles = { path = "crates/visiaengine-io-tiles", version = "0.1.0" }
visiaengine-io-hdr = { path = "crates/visiaengine-io-hdr", version = "0.1.0" }
visiaengine-geo = { path = "crates/visiaengine-geo", version = "0.1.0" }

# Third-party pins (plan §1, measured on crates.io 2026-09-03)
wgpu = "30"                    # architecture clause ⑨: major-version pin + quarterly upgrade window
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }  # trimmed wayland CSD (adwaita titlebar drawing -> the ttf-parser unmaintained RUSTSEC-2026-0192 propagation surface disappears; in SDK form decoration belongs to the host, which also serves the startup-size goal)
bytemuck = "1"
pollster = "1"
thiserror = "2"
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }  # io-text rasterizer: SIMD off (wasm traps #25/#72), hashbrown kept (no_std must pick std/hashbrown [docs feature-flags])
glam = "0.33"   # referenced only by render (camera math) and render-wgpu (uniform transforms); core/io-* carry zero matrix deps (K6 gate)
raw-window-handle = "0.6"
