[package]
name = "examples"
description = "Rust tutorial shell package: the [[example]] registration home of the E-family examples (cargo track; outside the CMake build graph -- run side = ctest forwarding / pixi smoke / RA)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
visiaengine-core.workspace = true
visiaengine-render.workspace = true
visiaengine-render-wgpu.workspace = true
visiaengine-io-gltf.workspace = true
visiaengine-geo.workspace = true
visiaengine-io-points.workspace = true
visiaengine-io-tiles.workspace = true
visiaengine-io-text.workspace = true
visiaengine-io-hdr.workspace = true
# direct third-party use = the top lines of examples/rs/*.rs + full-path reference sweep (S1 census: image x1 pollster x4 wgpu x4 winit x4)
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true

# explicit registration (bevy form): files sit at the package root, not the examples/ auto-discovery spot; the E-number three-way lock (filename = header comment = index) lives in gate-docs.
