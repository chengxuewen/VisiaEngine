<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>E401 拾取演示</title>
<style>body{margin:0;background:#0b0f14;color:#cdd6e0;font:14px system-ui}canvas{display:block;margin:2vh auto;border:1px solid #2a3340}p{padding:0 16px}</style></head>
<body><p id="st">E401_pick_demo · 初始化…</p><canvas id="c" width="640" height="480"></canvas>
<!-- gate-web load anchor: the gate server holds this response until the
     post-await beacon below arrives; 404 in real browsers (harmless) -->
<img src="/ve-gate-ready/E401_pick_demo" alt="" style="display:none">
<script src="./common.js"></script>
<script type="module">
const st = document.getElementById('st'), canvas = document.getElementById('c');
let eng; try { eng = await veBoot(canvas); } catch (e) { veFail(st, e.message); throw e; }
const geo = await veFile('./park.geojson');
eng.loadGeoJsonBytes(geo);
const NONE = 18446744073709551615n;
let hits = 0;
st.textContent = `就绪（实体 ${eng.entityCount()}）——点击场景拾取`;
canvas.addEventListener('click', e => {
  const h = eng.pick(e.offsetX, e.offsetY);
  st.textContent = h === NONE ? `pick：未命中（累计命中 ${hits}）`
    : `pick：命中实体 #${h}（累计命中 ${++hits}）`;
});
veOrbit(canvas, eng);
// await holds the load event until 8 heartbeat frames have turned (gate-web
// dumps at load; see COUPLING note in common.js veLoop)
await veLoop(eng);
// Beacon: requested only after the 8-frame promise (VE_GATE_FRAMES) settles;
// the gate server releases the load anchor on it. Matches VE_GATE_MIN_FRAMES
// in scripts/gate-web.sh (COUPLING: all named in common.js veLoop).
// Harmless 404 in real browsers / other servers.
new Image().src = '/ve-gate-ready/E401_pick_demo?t=' + Date.now();
</script></body></html>
