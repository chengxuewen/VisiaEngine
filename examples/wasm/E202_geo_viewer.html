<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>E202 地理视图（park）</title>
<style>body{margin:0;background:#0b0f14;color:#cdd6e0;font:14px system-ui}canvas{display:block;margin:2vh auto;border:1px solid #2a3340}p{padding:0 16px}</style></head>
<body><p id="st">E202_geo_viewer · 初始化…</p><canvas id="c" width="640" height="480"></canvas>
<script src="./common.js"></script>
<script type="module">
const st = document.getElementById('st'), canvas = document.getElementById('c');
let eng; try { eng = await veBoot(canvas); } catch (e) { veFail(st, e.message); throw e; }
const geo = await veFile('./park.geojson');
const rc = eng.loadGeoJsonBytes(geo);
st.textContent = `就绪（load rc=${rc} · 实体 ${eng.entityCount()}）——与 native geo_viewer 同形色带`;
veOrbit(canvas, eng);
veLoop(eng);
</script></body></html>
