<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>E811 实体显隐</title>
<style>body{margin:0;background:#0b0f14;color:#cdd6e0;font:14px system-ui}canvas{display:block;margin:2vh auto;border:1px solid #2a3340}p{padding:0 16px}</style></head>
<body><p id="st">E811_entity_hide · 初始化…</p><canvas id="c" width="640" height="480"></canvas>
<!-- gate-web load anchor: the gate server holds this response until the
     post-await beacon below arrives; 404 in real browsers (harmless) -->
<img src="/ve-gate-ready/E811_entity_hide" alt="" style="display:none">
<script src="./common.js"></script>
<script type="module">
// Parity with native E811_entity_hide_c.c: a TWO-PRIMITIVE scene
// (hierarchy.glb = 2 nodes / 1 mesh, the wasm twin of twoprim.glb),
// hide the clicked entity, visibility-query round trip in the status
// line, double-click restores all. The C contract trio rides along:
// a hidden piece never hits itself on pick / enumeration domain
// unchanged / setEntityVisible round-trip.
const st = document.getElementById('st'), canvas = document.getElementById('c');
let eng; try { eng = await veBoot(canvas); } catch (e) { veFail(st, e.message); throw e; }
const glb = await veFile('./hierarchy.glb');
if (eng.loadGltfBytes(glb) !== 0) { veFail(st, 'loadGltfBytes failed'); throw new Error('load failed'); }
const NONE = 18446744073709551615n;
const all = () => Array.from({ length: eng.entityCount() }, (_, i) => eng.entityAt(i));
let hidden = 0;
st.textContent = `就绪（双图元 · 实体 ${eng.entityCount()}）——单击隐藏命中项，双击复原`;
canvas.addEventListener('click', e => {
  const h = eng.pick(e.offsetX, e.offsetY);
  if (h === NONE) { st.textContent = '未命中 —— 单击图元隐藏它'; return; }
  if (eng.setEntityVisible(h, false) !== 0) { st.textContent = `隐藏 #${h} 被拒`; return; }
  // the C contract: query reflects the hide + the hidden piece misses itself
  const q = eng.entityVisible(h) === 0 ? 'query=hidden' : 'query=STILL-VISIBLE(BUG)';
  const selfHit = eng.pick(e.offsetX, e.offsetY) === h ? 'self-pick(BUG)' : 'self-pick=miss';
  ++hidden;
  st.textContent = `已隐藏 #${h}（计 ${hidden}）· ${q} · ${selfHit} —— 双击复原`;
});
canvas.addEventListener('dblclick', () => {
  for (const h of all()) eng.setEntityVisible(h, true);
  hidden = 0; st.textContent = '已全部复原';
});
veOrbit(canvas, eng);
// await holds the load event until 8 heartbeat frames have turned (gate-web
// dumps at load; see COUPLING note in common.js veLoop)
await veLoop(eng);
// Beacon: requested only after the 8-frame promise (VE_GATE_FRAMES) settles;
// the gate server releases the load anchor on it. Matches VE_GATE_MIN_FRAMES
// in scripts/gate-web.sh (COUPLING: all named in common.js veLoop).
// Harmless 404 in real browsers / other servers.
new Image().src = '/ve-gate-ready/E811_entity_hide?t=' + Date.now();
</script></body></html>
