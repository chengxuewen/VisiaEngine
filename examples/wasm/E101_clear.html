<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>E101 清屏渲染基线</title>
<style>body{margin:0;background:#0b0f14;color:#cdd6e0;font:14px system-ui}canvas{display:block;margin:2vh auto;border:1px solid #2a3340}p{padding:0 16px}</style></head>
<body><p id="st">E101_clear · 初始化…</p><canvas id="c" width="640" height="480"></canvas>
<!-- gate-web load anchor: the gate server holds this response until the
     post-await beacon below arrives; 404 in real browsers (harmless) -->
<img src="/ve-gate-ready" alt="" style="display:none">
<script src="./common.js"></script>
<script type="module">
const st = document.getElementById('st'), canvas = document.getElementById('c');
let eng; try { eng = await veBoot(canvas); } catch (e) { veFail(st, e.message); throw e; }
st.textContent = '就绪（空场景清屏 + 逐帧渲染循环）——这就是引擎的心跳';
let n = 0;
// await holds the load event until 8 heartbeat frames have turned (gate-web
// dumps at load; see COUPLING note in common.js veLoop)
await veLoop(eng, () => { if (++n % 60 === 0) st.textContent = `帧 ${n} · 60fps 走表`; });
// Beacon: requested only after the 8-frame promise (VE_GATE_FRAMES) settles;
// a pending image subresource holds the load event so the gate's dump lands
// after boot. Matches VE_GATE_MIN_FRAMES in scripts/gate-web.sh (COUPLING: both
// named in common.js veLoop). Harmless 404 in real browsers / other servers.
new Image().src = '/ve-gate-ready?t=' + Date.now();
</script></body></html>
