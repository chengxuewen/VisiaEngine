<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>E508 PBR 材质</title>
<style>body{margin:0;background:#0b0f14;color:#cdd6e0;font:14px system-ui}canvas{display:block;margin:2vh auto;border:1px solid #2a3340}p{padding:0 16px}#hud{padding:0 16px;color:#8fa3b8}b{color:#e8b339}</style></head>
<body><p id="st">E508_pbr_materials · 初始化…</p><canvas id="c" width="640" height="480"></canvas>
<div id="hud">材质球三联（粗糙度×金属度阶梯）· <b>1</b> bloom · <b>2</b> outline · <b>3</b> 全关</div>
<!-- gate-web load anchor -->
<img src="/ve-gate-ready/E508_pbr_materials" alt="" style="display:none">
<script src="./common.js"></script>
<script type="module">
// Parity with native E508: material balls across the roughness x metalness
// grid, 1/2 bloom/outline toggles, 3 off (same post bridge as E506).
// The addMesh bridge already carries roughness/metalness, so this page is
// pure consumption. Honesty (REND-25/26 clause): specular = Lambert-style
// mock, not GGX -- the balls show the parameter axis, not true PBR.
const st = document.getElementById('st'), canvas = document.getElementById('c');
let eng; try { eng = await veBoot(canvas); } catch (e) { veFail(st, e.message); throw e; }

// low-poly UV sphere (rings x sectors), normal == normalized position
const sphere = (rings, sectors) => {
  const pos = [], idx = [];
  for (let i = 0; i <= rings; i++) {
    const phi = (i / rings) * Math.PI;
    for (let j = 0; j <= sectors; j++) {
      const th = (j / sectors) * Math.PI * 2;
      const x = Math.sin(phi) * Math.cos(th), y = Math.cos(phi), z = Math.sin(phi) * Math.sin(th);
      pos.push(x, y, z);
    }
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < sectors; j++) {
    const a = i * (sectors + 1) + j, b = a + sectors + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  return { pos: Float32Array.from(pos), idx: Uint32Array.from(idx), nrm: Float32Array.from(pos) };
};
const S = sphere(12, 20);

// 3x3 grid: roughness 0.05..0.9 down, metalness 0..1 across
const ROUGH = [0.05, 0.35, 0.9], METAL = [0.0, 0.5, 1.0];
for (let r = 0; r < 3; r++) for (let m = 0; m < 3; m++) {
  eng.addMesh(S.pos, S.nrm, S.idx,
    Float32Array.from([0.75, 0.72, 0.68, 1]),
    Float64Array.from([-2.6 + m * 2.6, 1.1, -2.2 + r * 2.2]),
    ROUGH[r], METAL[m]);
}
eng.addMesh( // ground
  Float32Array.from([-8,-0.5,-8, 8,-0.5,-8, 8,-0.5,8, -8,-0.5,8,
                      -8,0.5,-8, 8,0.5,-8, 8,0.5,8, -8,0.5,8]),
  new Float32Array(24), Uint32Array.from([0,2,1, 0,3,2, 4,5,6, 4,6,7, 0,1,5, 0,5,4, 2,3,7, 2,7,6, 1,2,6, 1,6,5, 3,0,4, 3,4,7]),
  Float32Array.from([0.22, 0.26, 0.3, 1]), Float64Array.from([0, 0, 0]), 0.9, 0);

let bloom = false, outline = false;
const apply = () => {
  const post = [];
  if (bloom) post.push(0, 0.8, 0);
  if (outline) post.push(1, 1.5, 0);
  const rc = eng.setPostEffects(Float64Array.from(post));
  st.textContent = rc === 0
    ? `${[bloom && 'bloom', outline && 'outline'].filter(Boolean).join('+') || 'off'}（1/2 切换，3 全关；mock specular 非 GGX）`
    : `setPostEffects rc=${rc}`;
};
window.addEventListener('keydown', e => {
  if (e.key === '1') bloom = !bloom;
  else if (e.key === '2') outline = !outline;
  else if (e.key === '3') { bloom = outline = false; }
  else return;
  apply();
});
veOrbit(canvas, eng);
apply();
await veLoop(eng);
new Image().src = '/ve-gate-ready/E508_pbr_materials?t=' + Date.now();
</script></body></html>
