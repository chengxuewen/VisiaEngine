# VisiaEngine dev environment -- pixi single-source management (D5)
# Discipline: .agents/rules/common/constraints.md | Guide: docs/env.md
# Usage: bash bootstrap.sh (first time) -> source pixi.sh (daily) | Verify: pixi run verify
# Note: rustfmt/clippy are not standalone conda package names (measured NOT-FOUND); the rust main package provides the binaries

[workspace]
name = "visiaengine"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rust = ">=1.98,<2"
ripgrep = ">=14,<16"
ccache = ">=4.9,<5"
pkg-config = ">=0.29,<1"
nodejs = ">=22,<23"
fonttools = ">=4.66.0,<5"

[feature.tools.dependencies]
cargo-deny = ">=0.20,<0.21"
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
sdl3 = ">=3.4,<4"

[feature.tools.target.linux-64.dependencies]
gxx_linux-64 = "*"   # the C++ compiler for the CMake consumption surface (linux-64 target slot only; not installed on Win/mac [plan §1③])
xorg-libx11 = "*"      # the E702 C demo consumption surface (FindX11 headers+libs; absent = E702 skips gracefully, double-gated)
xorg-xproto = "*"     # the base protocol headers Xlib.h depends on (the same lesson row as the host feature)
xorg-xvfb-server = ">=21.1.24,<22"

[feature.tools.tasks]
audit = "cargo deny check"

[feature.ide.dependencies]
rust-analyzer = "*"
rust-src = ">=1.98,<2"
# T-G4 (2026-10-12): the wasm lane's IDE face builds from the default env
# (cmake-build*), so the default toolchain must carry the wasm std -- the
# conda rustc on PATH otherwise answers cargo's rustc resolution WITHOUT
# wasm32 std and the build dies on E0463 (measured). Pin discipline is the
# wasm feature's row above [FFI-R:env-B1]; both spellings must move together.
rust-std-wasm32-unknown-unknown = "=1.98.0"

[feature.host.target.linux-64.dependencies]
# [FFI-R:FC-M1] This host has no bare nm/gcc (measured) -- gate-abi/demo use the conda binaries; package names verified via pixi search.
# ⚠ MUST be target-scoped (win-64 has no xorg candidates; solving all platforms explodes -- the I0 first-round measured lesson);
# the Windows escape-hatch scenario = cargo build without the host feature (the standing D5 plan; this environment is linux-only).
xorg-xvfb-server = "*"   # note: the real package name carries -server (the pixi search fuzzy-hit lesson)
xorg-libx11 = "*"
xorg-xproto = "*"      # the X.h/Xproto.h base protocol headers (Xlib.h depends on them; not inside the libx11 package)
gcc = "*"
binutils = "*"

[feature.wasm.dependencies]
# The components carry no rust<->cross-std lockstep run-dep [FFI-R:env-B1]: the pin must == the rust lockfile reality (1.98.0),
# moving either means moving both + committing the pixi.lock migration together (D5). The bindgen-cli schema duality is checked on execution day [FFI-R:CS-5].
rust-std-wasm32-unknown-unknown = "=1.98.0"
wasm-bindgen-cli = "=0.2.127"  # kept in sync with the Cargo pin (the schema changes every patch; measured mutual rejection, J1)
binaryen = "*"

[feature.qt.dependencies]
qt6-main = "*"   # the full Qt6 stack. Trap on record: conda-forge `qt-main` = Qt5! The real Qt6 name is `qt6-main` (the second case in the package-name trap family)

[feature.wasm.tasks]
web-probe = "bash scripts/web-probe.sh"   # J0 acceptance (version equality + rlib presence + a full-tree check run by hand)
web-check = "bash -c 'bash scripts/web-build.sh && cargo test -p visiaengine-wasm -- --ignored'"   # J2': build -> the CAPI-09 mirror (the explicit T2 chain)

[environments]
# Single-environment scheme: all lightweight binaries go into default (tools/ide and the base deps share a solve-group; no isolation needed)
default = { features = ["tools", "ide"], solve-group = "base" }
# Batch 2 I0 / batch 7 J0 (approval round 2026-09-11): the two spike environments share the base solve-group = a single toolchain [FFI-R:env-W2]
host-spike = { features = ["tools", "ide", "host"], solve-group = "base" }
wasm-spike = { features = ["tools", "ide", "wasm"], solve-group = "base" }
qt-spike = { features = ["tools", "ide", "qt"], solve-group = "base" }

[tasks]
# The cargo-flavored tasks are an interface contract: running them before the Cargo workspace lands (build day) must fail -- that is expected
check = "cargo check --workspace"
build = "cargo build --workspace"
test = "cargo test --workspace"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all -- --check"
fmt-fix = "cargo fmt --all"
# Single-file formatting is always rustfmt --edition 2024 <file> -- cargo fmt -- <path> is forbidden (its -- argument is NOT a path filter; a historical trap)
smoke-x11 = "bash scripts/smoke-x11.sh"   # batch 2 I3: Xvfb self-managed three-frame present
gate-abi = "bash scripts/gate-abi.sh"   # batch 2 I2: symbol whitelist + demo compile & run (the host-tool lookup form)
gate-trace = "bash scripts/spec-trace.sh"   # batch 2 v1.4: traceability nativized into the ci chain (sealing the [FFI-R:FC-6] false-green window)
gate-style = "bash -c '! grep -qE \"use serde_json|serde_json::\" crates/visiaengine-geo/src/style.rs'"   # the GEO-18 parsing-boundary gate (code shape; comments exempt)
gate-docs = "bash scripts/gate-docs.sh"   # batch 5 T3: the four zero-drift document checks
cmake-smoke = "bash scripts/cmake-smoke.sh"   # the CMake-layer three-state gate (SKIP on machines without cmake; includes negative-path messages)
# f5: refresh the .vscode managed debug lists -- the only preset that sees every lane (Qt on + debug knob); run after adding/changing examples
f5 = "pixi run cmake --preset debug"
i18n = "bash scripts/gate-i18n.sh"   # C20 artifact-language gate (whitelisted functional CJK; red/green proof duty per C0)
# pack-check (v1.3 P3; promoted INTO the ci chain by the publish band 2026-10-09):
# installed-tree hygiene -- manifest / self-sufficiency / no build-machine paths.
# Runs after cmake-smoke (it reuses that build dir; SKIPs with exit 0 when
# cmake/readelf are absent -- same gate-abi-family tool discipline, so a bare
# clone never goes red for an absent optional tool). RUNPATH stays report-only:
# cleaning belongs to the publish-band assembly step (scripts/gate-pack.sh header
# + the decision note in cmake/VisiaEnginePackaging.cmake).
pack-check = "bash scripts/gate-pack.sh"
# Band K (2026-10-08): XTEST input probe over the interactive example set.
# Out of the ci chain on purpose: it needs Xvfb + /usr/bin/xwd + a C compiler,
# which `pixi run ci` does not promise. It starts its own private display, so
# never wrap it in xvfb-run (PIT-22).
keys-probe = "python3 scripts/keys-probe.py --all"
gen-hdr = "python3 scripts/gen_hdr.py"   # regenerate the demo_sky.hdr fixture (discoverability; keys-probe precedent: bare python3, out of the ci chain)
# npm-pack: builder, not a gate — out of the ci chain (same policy as the wall serve /
# keys-probe). Assembles build/npm/visiaengine/ + a LOCAL .tgz from the wasm build
# output; needs node (default env) and a prior `pixi run web-check`. Nothing is
# published; the tarball stays on this machine.
npm-pack = "bash scripts/gen-npm-package.sh"
ci = { depends-on = ["fmt", "lint", "check", "test", "audit", "gate-style", "gate-trace", "gate-abi", "gate-docs", "check-promises", "cmake-smoke", "pack-check", "i18n"] }
smoke-clear = "bash scripts/smoke-rs.sh E101_clear"   # a ctest forwarding shell (argv single source = the R9 table; CI calls it under xvfb-run)
smoke-load-gltf = "bash scripts/smoke-rs.sh E201_load_gltf"   # L2: the glTF assembly chain (G3)
smoke-geo-viewer = "bash scripts/smoke-rs.sh E202_geo_viewer"   # L2: the GeoJSON chain (H4)
smoke-switch-camera = "bash scripts/smoke-rs.sh E301_switch_camera"   # L2: 2D<->3D switching (G4)
smoke-pick = "bash scripts/smoke-rs.sh E401_pick_demo"   # L2: pick->highlight chain (headless, no xvfb needed)
smoke-pick-hover = "bash scripts/smoke-rs.sh E402_pick_interactive"   # L2: hover/multi-select window (display; CI runs it under xvfb)
smoke-measure = "bash scripts/smoke-rs.sh E203_measure_cli"   # L2: the measurement CLI (pure CPU)
smoke-bench-twin = "bash scripts/smoke-rs.sh E601_bench_twin"
smoke-shadow-demo = "bash scripts/smoke-rs.sh E501_shadow_demo"
smoke-glass-water = "bash scripts/smoke-rs.sh E504_glass_water"
smoke-split-screen = "bash scripts/smoke-rs.sh E303_split_screen"
smoke-fly-camera = "bash scripts/smoke-rs.sh E302_fly_camera"
smoke-text-labels = "bash scripts/smoke-rs.sh E205_text_labels"
smoke-pcl-viewer = "bash scripts/smoke-rs.sh E204_pcl_viewer"   # L2: point cloud, dual mode (the headless self-asserting route)
smoke-tile-viewer = "bash scripts/smoke-rs.sh E206_tile_viewer"   # L2: MVT decode -> three-family render pixels (B3)
smoke-color-tuning = "bash scripts/smoke-rs.sh E502_color_tuning"   # L2: color-calibration round trip (headless self-assertion)
qt-demo-build = "cmake --preset ci-strict && cmake --build --preset ci-strict"   # the Qt round's consumption smoke (requires -e qt-spike; ci-strict = both SDKs forced PIXI)
smoke-qt = "bash scripts/smoke-qt.sh"   # three-state: no env / no X = SKIP (requires -e qt-spike)
smoke-twin-city = "bash scripts/smoke-rs.sh E901_twin_city"   # L2: the vertical-slice seed (the batch-4 one-image deliverable + human PNG check)
bench = "bash scripts/bench.sh"   # [6b] the artifact chain (two release examples; a local lavapipe observational tier, not a gate)
verify = "rustc --version && cargo --version && rustfmt --version && clippy-driver --version && cargo deny --version && rg --version"
smoke-morph = "bash scripts/smoke-rs.sh E304_projection_morph"
smoke-box-select = "bash scripts/smoke-rs.sh E403_box_select"
smoke-post = "bash scripts/smoke-rs.sh E506_postprocessing"   # L2: post chain bloom/outline pixel asserts (WGPU-34)
smoke-hdr = "bash scripts/smoke-rs.sh E507_hdr_tonemap"   # L2: tonemap + hdr fixture pixel asserts (REND-44/IO-17)
smoke-curve = "bash scripts/smoke-rs.sh E510_route_flow"   # L2: curves ribbon/tube + flow markers (REND-47)
smoke-gate = "bash scripts/smoke-rs.sh E511_gate"   # L2: rigid node transform rotation (CAPI-42/43)
smoke-pbr = "bash scripts/smoke-rs.sh E508_pbr_materials"   # L2: GGX metallic/dielectric + roughness ladder asserts (WGPU-35/REND-45)
smoke-ssao = "bash scripts/smoke-rs.sh E509_ssao"   # L2: SSAO off-vs-on crease-band pixel assert (WGPU-36)
smoke-cjk = "bash scripts/smoke-rs.sh E505_cjk_labels"
window-probe = { cmd = "bash scripts/window-probe.sh", cwd = "." }   # the windowed examples' first-frame guard (the black-screen trio cure): window-probe.sh <E###>
docs-gen = "bash scripts/gen-llms-txt.sh"   # llms.txt + rustdoc reference (D3)
check-promises = "bash scripts/check-promises.sh"   # overclaim lint (D1; --self-test proven)
