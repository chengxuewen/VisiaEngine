# VisiaEngine 开发环境 — pixi 单源管理（D5）
# 纪律: .agents/rules/common/constraints.md | 指南: docs/env.md
# 用法: bash bootstrap.sh（首次）→ source pixi.sh（日常）| 验证: pixi run verify
# 注意: rustfmt/clippy 非独立 conda 包名（实测 NOT-FOUND），二进制由 rust 主包提供

[workspace]
name = "visiaengine"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rust = ">=1.98,<2"
ripgrep = ">=14,<16"
ccache = ">=4.9,<5"
pkg-config = ">=0.29,<1"
nodejs = ">=22,<23"

[feature.tools.dependencies]
cargo-deny = ">=0.20,<0.21"

[feature.tools.tasks]
audit = "cargo deny check"

[feature.ide.dependencies]
rust-analyzer = "*"
rust-src = ">=1.98,<2"

[feature.host.target.linux-64.dependencies]
# [FFI-R:FC-M1] 本机无裸 nm/gcc（实测）——gate-abi/demo 走 conda 件；包名 pixi search 实证。
# ⚠ 必须 target 限定（win-64 无 xorg 候选，solve 全平台炸——I0 首轮实测教训）；
# Windows 逃生舱场景=cargo build 不带 host feature（D5 既定，本环境仅 linux 用）。
xorg-xvfb-server = "*"   # 注意：真包名带 -server（pixi search 模糊命中教训）
xorg-libx11 = "*"
gcc = "*"
binutils = "*"

[feature.wasm.dependencies]
# 组件无 rust↔cross-std 锁步 run-dep [FFI-R:env-B1]：pin 必须 == rust 锁文件实况(1.98.0)，
# 动任一必同步另一 + pixi.lock 随迁入库（D5）。bindgen-cli schema 对偶执行日校验 [FFI-R:CS-5]。
rust-std-wasm32-unknown-unknown = "=1.98.0"
wasm-bindgen-cli = "*"
binaryen = "*"

[feature.wasm.tasks]
web-probe = "bash scripts/web-probe.sh"   # J0 验收（版本相等+rlib 存在+全树 check 人跑）

[environments]
# 单环境方案：轻量二进制全部进 default（tools/ide 与 base 依赖同 solve-group，无隔离需求）
default = { features = ["tools", "ide"], solve-group = "base" }
# 批2 I0 / 批7 J0（批准轮 2026-09-11）：两 spike 环境共享 base solve-group=单一工具链 [FFI-R:env-W2]
host-spike = { features = ["tools", "ide", "host"], solve-group = "base" }
wasm-spike = { features = ["tools", "ide", "wasm"], solve-group = "base" }

[tasks]
# cargo 类 task 是接口合同：Cargo workspace 落地（动工日）前运行必失败，属预期
check = "cargo check --workspace"
build = "cargo build --workspace"
test = "cargo test --workspace"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all -- --check"
fmt-fix = "cargo fmt --all"
# 单文件格式化一律 rustfmt --edition 2024 <file>——禁止 cargo fmt -- <path>（其 -- 参数不是路径过滤，历史踩坑）
gate-abi = "bash scripts/gate-abi.sh"   # 批2 I2：符号白名单+demo 编译运行（host 工具检索式）
gate-trace = "bash scripts/spec-trace.sh"   # 批2 v1.4：追溯本机化入 ci 链（[FFI-R:FC-6] 假绿窗口封堵）
gate-style = "bash -c '! grep -qE \"use serde_json|serde_json::\" crates/visiaengine-geo/src/style.rs'"   # GEO-18 解析边界门禁（代码形态，注释豁免）
ci = { depends-on = ["fmt", "lint", "check", "test", "audit", "gate-style", "gate-trace", "gate-abi"] }
smoke-clear = "cargo run -p visiaengine-render-wgpu --example clear -- --frames 3"   # L2 窗口 smoke（S3 起有效；CI xvfb-run 调用）
smoke-load-gltf = "cargo run -p visiaengine-render-wgpu --example load_gltf -- resources/data/twoprim.glb --frames 3"   # L2：glTF 装配链路（G3）
smoke-geo-viewer = "cargo run -p visiaengine-render-wgpu --example geo_viewer -- resources/data/park.geojson --frames 3"   # L2：GeoJSON 链路（H4）
smoke-switch-camera = "cargo run -p visiaengine-render-wgpu --example switch_camera -- resources/data/twoprim.glb --frames 3"   # L2：2D↔3D 切换（G4）
smoke-pick = "cargo run -p visiaengine-render-wgpu --example pick_demo -- --frames 2"   # L2：拾取→高亮链（headless 免 xvfb）
smoke-measure = "cargo run -p visiaengine-geo --example measure_cli"   # L2：量测 CLI（纯 CPU）
verify = "rustc --version && cargo --version && rustfmt --version && clippy-driver --version && cargo deny --version && rg --version"
