[package]
name = "visiaengine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JS/wasm glue layer (band 7 route A): a pure marshaling thin leaf above the capi rlib (D10 pre-registered). An isolated crate from the C ABI face -- the no_mangle and bindgen symbol graphs never erode each other (J1 link-conflict isolation ruling)."

[lib]
crate-type = ["cdylib"]

[dependencies]
visiaengine-core.workspace = true
visiaengine-ffi = { path = "../../../crates/visiaengine-ffi", version = "0.1.0", features = ["web"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[lints]
workspace = true
