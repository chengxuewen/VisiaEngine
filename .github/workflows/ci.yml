# VisiaEngine CI -- pixi version pin (D5 clause ④). Until this repo mirrors GitHub, it is a "standby" setup:
# each step's same commands run locally by hand are equivalent (the plan K2 framing).
# Before enabling it for real, pin both actions to a commit SHA (tags can be moved):
# actions/checkout@v4 and prefix-dev/setup-pixi@v0.8.1.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workspace:
    name: fmt+lint+check+test+deny / L1 / L2 / invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.78.0
          cache: true

      - name: lavapipe (software Vulkan, L1) + xvfb (L2 window smoke) + x11-apps (xwd)
        # x11-apps is NOT optional: `xwd` (the capture tool behind window-probe-all.sh
        # and keys-probe) ships in that system package, not in pixi. Without it both
        # probes skip themselves and the L2 step reports green while testing nothing.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb x11-apps

      - run: pixi install --frozen
      # Materialize the gitignored host layers first: gate-agents/gate-skills treat
      # a missing primary layer as a defect (only activation layers such as .trae
      # are optional). This also surfaces generated files that were not committed.
      - run: pixi run agents sync
      - run: pixi run ci

      # PF3: the declared MSRV (Cargo.toml rust-version = 1.98.0) must really
      # compile. The `msrv` environment pins rust 1.98.0 and sits outside the base
      # solve-group, so it cannot bump the shared lock.
      - name: MSRV (rust 1.98.0)
        run: |
          pixi install -e msrv --frozen
          pixi run -e msrv cargo check --workspace

      - name: invariant ① core has no rendering deps
        run: |
          ! cargo tree -p visiaengine-core -i wgpu
          ! grep -rq 'use wgpu' crates/visiaengine-core/src/

      - name: SDD<->test bidirectional trace
        run: bash scripts/spec-trace.sh

      - name: L2 window smoke
        run: |
          xvfb-run -a pixi run smoke-clear
          xvfb-run -a pixi run smoke-load-gltf
          xvfb-run -a pixi run smoke-switch-camera
          xvfb-run -a pixi run smoke-geo-viewer
          pixi run smoke-x11   # attach three-frame present (the script manages its own Xvfb / reuses the system DISPLAY)
          pixi run -e wasm-spike web-check   # J2': wasm build + the CAPI-09 dual-surface mirror
          pixi run gate-web   # headless page gate (honest SKIP on runners without chromium -- the script owns the contract)
          xvfb-run -a pixi run smoke-pick
          pixi run smoke-bench-twin    # 4c: headless instantiation stress (debug-capped 5000)
          pixi run smoke-shadow-demo   # 4f: PCSS shadow-spot area assert
          pixi run smoke-twin-city     # band 5: vertical-slice PNG exit assert
          xvfb-run -a pixi run smoke-measure   # pure CPU (harmless under a uniform xvfb mount)
          pixi run smoke-hdr                   # N5: tonemap + hdr fixture asserts
          pixi run smoke-pbr                   # N6: GGX metallic/dielectric + roughness ladder asserts
          pixi run smoke-ssao                  # N7: SSAO off-vs-on crease-band asserts
          # Band K: first-frame brightness guard over every resident-window example
          # (self-managed Xvfb; was caller-less since it landed -- wired here).
          bash scripts/window-probe-all.sh   # with xwd present it really runs (a missing tool makes it SKIP exit 0)
          # Band K: XTEST key/wheel/drag probe -- fails when a window stays alive
          # but the picture never changes (pixel gates cannot see an unwired handler).
          pixi run keys-probe --strict   # skip-as-red here: a silent skip = a green not earned (PIT-25)
          # the cmake example family is not listed separately: the tenth segment of pixi run ci, cmake-smoke, already runs ctest -LE display

  qt:
    name: Qt widget consumption surface (the E703 real window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.78.0
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb
      - run: pixi install --frozen && pixi install -e qt-spike --frozen
      - run: xvfb-run -a pixi run -e qt-spike smoke-qt   # three-state gate: missing env = SKIP exit 0; a real machine must run a real window
