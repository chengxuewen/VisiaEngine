# VisiaEngine CI — pixi 钉版（D5 条款④）。本仓镜像 GitHub 日前为"待命"状态：
# 各 step 同款命令本机手跑即等价（计划 K2 口径）。
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workspace:
    name: fmt+lint+check+test+deny / L1 / L2 / 不变式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.78.0
          cache: true

      - name: lavapipe(软件 Vulkan, L1) + xvfb(L2 窗口 smoke) + x11-apps(xwd)
        # x11-apps is NOT optional: `xwd` (the capture tool behind window-probe-all.sh
        # and keys-probe) ships in that system package, not in pixi. Without it both
        # probes skip themselves and the L2 step reports green while testing nothing.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb x11-apps

      - run: pixi install --frozen
      - run: pixi run ci

      - name: 不变式① core 无渲染依赖
        run: |
          ! cargo tree -p visiaengine-core -i wgpu
          ! grep -rq 'use wgpu' crates/visiaengine-core/src/

      - name: SDD↔测试双向追溯
        run: bash scripts/spec-trace.sh

      - name: L2 窗口 smoke
        run: |
          xvfb-run -a pixi run smoke-clear
          xvfb-run -a pixi run smoke-load-gltf
          xvfb-run -a pixi run smoke-switch-camera
          xvfb-run -a pixi run smoke-geo-viewer
          pixi run smoke-x11   # attach 三帧 present（脚本自管 Xvfb/复用系统 DISPLAY）
          pixi run -e wasm-spike web-check   # J2′：wasm 构建+CAPI-09 双面镜像
          xvfb-run -a pixi run smoke-pick
          pixi run smoke-bench-twin    # 4c：headless 实例化压力（debug 帽 5000）
          pixi run smoke-shadow-demo   # 4f：PCSS 影斑面积断言
          pixi run smoke-twin-city     # 批5：垂直切片 PNG 出口断言
          xvfb-run -a pixi run smoke-measure   # 纯 CPU（统一挂 xvfb 无害）
          pixi run smoke-hdr                   # N5: tonemap + hdr fixture asserts
          pixi run smoke-pbr                   # N6: GGX metallic/dielectric + roughness ladder asserts
          pixi run smoke-ssao                  # N7: SSAO off-vs-on crease-band asserts
          # Band K: first-frame brightness guard over every resident-window example
          # (self-managed Xvfb; was caller-less since it landed -- wired here).
          bash scripts/window-probe-all.sh   # xwd 在位=真跑（缺件它会 SKIP exit0）
          # Band K: XTEST key/wheel/drag probe -- fails when a window stays alive
          # but the picture never changes (pixel gates cannot see an unwired handler).
          pixi run keys-probe --strict   # skip-as-red here: a silent skip = a green not earned (PIT-25)
          # cmake example 族不另列：pixi run ci 第十段 cmake-smoke 内含 ctest -LE display

  qt:
    name: Qt widget 消费面（E703 真窗）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.78.0
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb
      - run: pixi install --frozen && pixi install -e qt-spike --frozen
      - run: xvfb-run -a pixi run -e qt-spike smoke-qt   # 三态门：环境缺失=SKIP exit0，真机必真窗
